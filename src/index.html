<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Task</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./iphone.js"></script>
  </head>
  <body>
    <iphone-frame>



      <div class="design-instagram">



        <div class="first-part">
          <img src="/src/elements/Back.png" />
          <p style="font-size: 20px;" class="user-name">user_name</p>
          <img src="/src/elements/options.png" />
        </div>
  


        <div class="second-part">
          <img style="width: 50%;" src="/src/elements/Avatar.png" />
          <div class="page-information">
            <div class="personal-page-information">
              <p>129</p>

            </div>
            <div class="personal-page-information" style="margin: 0px 27px;">

            </div>
            <div class="personal-page-information">
              <p>260</p>
              <p>Following</p>
            </div>
          </div>
        </div>
  


        <div class="third-part">
          <p style="font-size: 20px;">Name</p>
          <p style="color: gray; font-size: 16px;">Local Business</p>
          <a style="font-size: 17px; color: #D4E0ED" href="https://www.website.com">www.website.com</a>
        </div>
  


        <div class="fourth-part">
          <button id="follow" class="button">Follow</button>
          <button class="button">Message</button>
          <button class="button">Email</button>
          <button class="button" style="width: 36px;height: 33px;padding: 0;background-color: transparent"><img
              src="/src/elements/Vector 2.png" /></button>
        </div>



        <div class="fifth-part">
          <div class="highlight__icon">
            <img src="/src/elements/Vector.png" class="highlight__circle">
          </div>

          <div class="highlight__icon">

          </div>
            <p class="highlight__text">Highlight</p>
        
          <div class="highlight__icon">
            <img src="/src/elements/Union (1).png" class="highlight__circle">
          </div>
            <p class="highlight__text">Highlight</p>
        
          <div class="highlight__icon">
            <img src="/src/elements/Vector (1).png" class="highlight__circle">
          </div>
            <p class="highlight__text">Highlight</p>
        </div>
  


      <div class="photos">
  
        <div class="posts">
          <div class="your-posts">
            <img src="/src/elements/photos.png"/>
          </div>
          <div class="posts-where-you-are-tagged">
            <img src="/src/elements/tags.png"/>
  
          </div>
        </div>


  
        <div class="published-posts">
          <img class="posts-9" src ="/src/elements/Img-01.png"/>
          <img class="posts-9" src ="/src/elements/Img-02.png"/>
          <img class="posts-9" src ="/src/elements/Img-03.png"/>
          <img class="posts-9" src ="/src/elements/Img-04.png"/>
          <img class="posts-9" src ="/src/elements/Img-05.png"/>
          <img class="posts-9" src ="/src/elements/Img-06.png"/>
          <img class="posts-9" src ="/src/elements/Img-07.png"/>
          <img class="posts-9" src ="/src/elements/Img-08.png"/>
          <img class="posts-9" src ="/src/elements/Img-09.png"/>
        </div>


  
        <div class="menu">
          <img src="/src/elements/Vector (2).png"/>
          <img src="/src/elements/Search.png"/>
          <img src="/src/elements/Add.png"/>
          <img src="/src/elements/Like.png"/>
          <img src="/src/elements/Avatar.png"/>
